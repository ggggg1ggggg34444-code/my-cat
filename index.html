<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Виртуальный Басик 🐾</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f0f0; text-align: center; margin: 0; padding: 10px; user-select: none; -webkit-user-select: none; touch-action: none; }
        .game-container { background: #ffffff; max-width: 450px; height: 90vh; margin: 5px auto; padding: 15px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; box-sizing: border-box; border: 1px solid #e0e0e0; }
        h1 { margin: 5px 0; color: #333333; font-size: 22px; font-weight: 300; letter-spacing: 1px; }
        .game-field { flex-grow: 1; position: relative; margin: 10px 0; background: #e5e5e5; border-radius: 25px; overflow: hidden; box-shadow: inset 0 5px 15px rgba(0,0,0,0.05); }
        .room-walls { position: absolute; width: 100%; height: 70%; background: #f4f4f4; border-bottom: 8px solid #dcdcdc; }
        .room-floor { position: absolute; bottom: 0; width: 100%; height: 30%; background: #ececec; }
        .window { position: absolute; top: 20px; left: 30px; width: 100px; height: 130px; background: #fff; border: 4px solid #ffffff; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); overflow: hidden; display: flex; align-items: center; justify-content: center; z-index: 1; }
        .window-view { width: 100%; height: 100%; object-fit: cover; }
        .window-frame { position: absolute; background: #ffffff; }
        .window-frame.v { width: 4px; height: 100%; left: 50%; transform: translateX(-50%); }
        .window-frame.h { height: 4px; width: 100%; top: 40%; }
        .sofa { position: absolute; bottom: 25%; right: -20px; width: 160px; height: 95px; background: #333333; border-radius: 20px 0 0 15px; z-index: 2; box-shadow: -5px 5px 15px rgba(0,0,0,0.1); }
        .sofa-cushion { position: absolute; bottom: 0; left: 10px; width: 140px; height: 45px; background: #4f4f4f; border-radius: 10px 0 0 10px; }
        .sofa-pillow { position: absolute; top: 15px; left: 20px; width: 35px; height: 35px; background: #7a7a7a; border-radius: 8px; transform: rotate(-15deg); }
        .rug { position: absolute; bottom: 5px; left: calc(50% - 90px); width: 180px; height: 65px; background: radial-gradient(ellipse, #7f8c8d 0%, #bdc3c7 70%, transparent 100%); z-index: 2; opacity: 0.8; }
        .cat-container { pointer-events: none; z-index: 3; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; bottom: -15px; }
        .cat-img { max-width: 65%; max-height: 200px; border-radius: 15px; transition: transform 0.2s; object-fit: contain; }
        .bounce { animation: bounceAnim 0.4s ease; }
        .toy-ball { width: 55px; height: 55px; background: radial-gradient(circle at 18px 18px, #7a7a7a, #222222); border-radius: 50%; position: absolute; cursor: grab; touch-action: none; box-shadow: 0 8px 15px rgba(0,0,0,0.3); z-index: 9999; left: 0; top: 0; }
        .status-container { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 15px; border: 1px solid #eaeaea; }
        .status { font-size: 14px; font-weight: bold; color: #555555; }
        #message { color: #333333; font-weight: bold; min-height: 20px; margin: 5px 0; font-size: 14px; }
        .buttons { display: flex; justify-content: center; gap: 10px; margin-top: 5px; }
        .btn { background: #333333; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 15px; cursor: pointer; flex: 1; transition: 0.2s; font-weight: bold; }
        @keyframes bounceAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Виртуальный Басик 🐾</h1>
    
    <div class="status-container">
        <div class="status">🍖 Сытость: <span id="hunger">100</span>%</div>
        <div class="status">🎉 Радость: <span id="happiness">100</span>%</div>
    </div>
    
    <div id="message">В комнате тепло и уютно... 🏠</div>
    
    <div class="game-field" id="field">
        <div class="room-walls"></div>
        <div class="room-floor"></div>

        <div class="window">
            <img id="window-bg" class="window-view" src="" alt="Погода">
            <div class="window-frame v"></div>
            <div class="window-frame h"></div>
        </div>

        <div class="sofa">
            <div class="sofa-pillow"></div>
            <div class="sofa-cushion"></div>
        </div>

        <div class="rug"></div>

        <div class="cat-container">
            <img id="cat" class="cat-img" src="MVIMG_20261008_193929.jpg" alt="Басик">
        </div>

        <div id="ball" class="toy-ball"></div>
    </div>

    <div class="buttons">
        <button class="btn" onclick="feedCat()">Покормить 🐟</button>
        <button class="btn" onclick="petCat()">Погладить 👋</button>
    </div>
</div>

<script>
    let hunger = 100;
    let happiness = 100;
    
    const cat = document.getElementById('cat');
    const ball = document.getElementById('ball');
    const field = document.getElementById('field');
    const msg = document.getElementById('message');

    let ballX = 80;
    let ballY = 200;
    let vx = 0;
    let vy = 0;
    const gravity = 0.35;
    const bounce = -0.65;
    const friction = 0.98;
    const ballSize = 55;

    let isDragging = false;
    let lastTouchX = 0;
    let lastTouchY = 0;
    let touchId = null;

    function updateSeasonView() {
        const month = new Date().getMonth();
        const windowBg = document.getElementById('window-bg');
        
        if (month === 11 || month === 0 || month === 1) {
            windowBg.src = "https://unsplash.com";
            msg.innerText = "За окном кружится пушистый снег... ❄️";
        } else if (month >= 2 && month <= 4) {
            windowBg.src = "https://unsplash.com";
            msg.innerText = "Весна пришла! Почки распускаются 🌱";
        } else if (month >= 5 && month <= 7) {
            windowBg.src = "https://unsplash.com";
            msg.innerText = "Жаркое лето за окошком! ☀️🏖️";
        } else {
            windowBg.src = "https://unsplash.com";
            msg.innerText = "Листопад за окном... Уютная осень 🍂";
        }
    }
    updateSeasonView();

    setTimeout(() => {
        const fieldRect = field.getBoundingClientRect();
        ballX = 40;
        ballY = fieldRect.height - ballSize - 15;
        updateBallPosition();
    }, 100);

    function updateBallPosition() {
        ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
    }

    function animate() {
        if (!isDragging) {
            vy += gravity;
            vx *= friction;
            vy *= friction;
            
            ballX += vx;
            ballY += vy;

            const fieldRect = field.getBoundingClientRect();

            if (ballX + ballSize > fieldRect.width) {
                ballX = fieldRect.width - ballSize;
                vx *= bounce;
            } else if (ballX < 0) {
                ballX = 0;
                vx *= bounce;
            }

            if (ballY + ballSize > fieldRect.height) {
                ballY = fieldRect.height - ballSize;
                vy *= bounce;
                vx *= 0.93; 
            } else if (ballY < 0) {
                ballY = 0;
                vy *= bounce;
            }

            updateBallPosition();

            if ((Math.abs(vx) > 0.5 || Math.abs(vy) > 0.5) && checkCollision()) {
                happiness = Math.min(100, happiness + 5);
                triggerAnimation("Басик поймал летящий мяч! 🏀🎉");
                vx *= -0.4;
                vy *= -0.4;
            }
        }
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    ball.addEventListener('touchstart', (e) => {
        if (hunger <= 0 || happiness <= 0) return;
        isDragging = true;
        vx = 0; vy = 0;
        const touch = e.changedTouches;
        touchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let touch = null;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) { touch = e.touches[i]; break; }
        }
        if (!touch) return;
        e.preventDefault();

        const fieldRect = field.getBoundingClientRect();
        
        ballX = touch.clientX - fieldRect.left - (ballSize / 2);
        ballY = touch.clientY - fieldRect.top - (ballSize / 2);

        ballX = Math.max(0, Math.min(ballX, fieldRect.width - ballSize));
        ballY = Math.max(0, Math.min(ballY, fieldRect.height - ballSize));

        vx = touch.clientX - lastTouchX;
        vy = touch.clientY - lastTouchY;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;

        updateBallPosition();
    }, { passive: false });

    window.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        touchId = null;
        vx = Math.max(-12, Math.min(vx, 12));
        vy = Math.max(-12, Math.min(vy, 12));
    });

    function updateStatus() {
        document.getElementById('hunger').innerText = hunger;
        document.getElementById('happiness').innerText = happiness;
        if (hunger <= 0 || happiness <= 0) {
            msg.innerText = "Басик уснул... 💤";
        }
    }

function triggerAnimation(text) {
if (hunger <= 0 || happiness <= 0) return;
msg.innerText = text;
cat.classList.add('bounce');
cat.src = "MVIMG_20261008_193930.jpg";
setTimeout(() => {
cat.classList.remove('bounce');
cat.src = "MVIMG_20261008_193929.jpg";
updateStatus();
}, 1200);
}
function feedCat() {
if (hunger <= 0 || happiness <= 0) return;
hunger = Math.min(100, hunger + 25);
triggerAnimation("Муррр! Очень вкусная рыбка! 🐟");
}
function petCat() {
if (hunger <= 0 || happiness <= 0) return;
happiness = Math.min(100, happiness + 20);
triggerAnimation("Мур-мур... Басику приятно! 🥰");
}
function checkCollision() {
const ballRect = ball.getBoundingClientRect();
const catRect = cat.getBoundingClientRect();
return !(ballRect.right < catRect.left || ballRect.left > catRect.right || ballRect.bottom < catRect.top || ballRect.top > catRect.bottom);
}
setInterval(() => {
if (hunger > 0 && happiness > 0) {
hunger = Math.max(0, hunger - 2);
happiness = Math.max(0, happiness - 3);
updateStatus();
}
}, 6000);
