<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Виртуальный Басик 🐾</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h1 { color: #d81b60; margin-bottom: 20px; font-size: 24px; }
        .cat-avatar { font-size: 70px; margin: 20px 0; transition: transform 0.2s; }
        .cat-avatar:active { transform: scale(1.1); }
        .status-bar { margin: 15px 0; text-align: left; }
        .label { font-weight: bold; color: #555; font-size: 14px; margin-bottom: 5px; }
        .progress-bg { background: #e0e0e0; border-radius: 10px; height: 16px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transition: width 0.3s ease, background-color 0.3s; }
        .btn-container { display: flex; justify-content: space-around; margin-top: 25px; gap: 10px; }
        button {
            background: #d81b60; color: white; border: none; padding: 10px 15px;
            border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px;
            flex: 1; transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #c2185b; }
        button:active { transform: scale(0.95); }
        .message { font-style: italic; color: #777; min-height: 20px; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="game-card">
    <h1>Виртуальный Басик 🐾</h1>
    
    <div id="cat" class="cat-avatar">😸</div>
    <div id="message" class="message">Басик сыт и счастлив! ✨</div>

    <div class="status-bar">
        <div class="label">🍖 Сытость: <span id="satiety-txt">100</span>%</div>
        <div class="progress-bg"><div id="satiety-bar" class="progress-fill" style="background-color: #4caf50;"></div></div>
    </div>

    <div class="status-bar">
        <div class="label">🎉 Радость: <span id="joy-txt">100</span>%</div>
        <div class="progress-bg"><div id="joy-bar" class="progress-fill" style="background-color: #2196f3;"></div></div>
    </div>

    <div class="btn-container">
        <button onclick="feed()">Покормить 🐟</button>
        <button onclick="play()">Погладить 👋</button>
    </div>
</div>

<script>
    let satiety = 100;
    let joy = 100;

    const catEl = document.getElementById('cat');
    const msgEl = document.getElementById('message');
    const satTxt = document.getElementById('satiety-txt');
    const satBar = document.getElementById('satiety-bar');
    const joyTxt = document.getElementById('joy-txt');
    const joyBar = document.getElementById('joy-bar');

    function updateUI() {
        satTxt.innerText = satiety;
        satBar.style.width = satiety + '%';
        satBar.style.backgroundColor = satiety > 50 ? '#4caf50' : (satiety > 20 ? '#ff9800' : '#f44336');

        joyTxt.innerText = joy;
        joyBar.style.width = joy + '%';
        joyBar.style.backgroundColor = joy > 50 ? '#2196f3' : (joy > 20 ? '#ff9800' : '#f44336');

        if (satiety <= 0 && joy <= 0) {
            catEl.innerText = '😿';
            msgEl.innerText = 'Басик обиделся и загрустил... Требуется срочная забота!';
        } else if (satiety < 30 || joy < 30) {
            catEl.innerText = '😾';
            msgEl.innerText = 'Мяу! Мне некомфортно!';
        } else {
            catEl.innerText = '😸';
        }
    }

    function feed() {
        if (satiety < 100) {
            satiety = Math.min(100, satiety + 15);
            msgEl.innerText = 'Хрум-хрум! Очень вкусная рыбка! 🐟';
            updateUI();
        }
    }

    function play() {
        if (joy < 100) {
            joy = Math.min(100, joy + 15);
            msgEl.innerText = 'Муррр! Басику нравятся поглаживания! 👋';
            updateUI();
        }
    }

    // Каждые 3 секунды показатели падают на 5%
    setInterval(() => {
        satiety = Math.max(0, satiety - 5);
        joy = Math.max(0, joy - 5);
        updateUI();
    }, 3000);

    updateUI();
</script>

</body>
</html>
