<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Виртуальный Басик 🐾</title>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .game-room {
            background: #fff;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            text-align: center;
            width: 340px;
        }
        h1 { color: #2c3e50; font-size: 22px; margin-top: 0; }
        
        /* Физический контейнер комнаты */
        .sofa-zone {
            background: #e2e8f0; 
            border: 4px solid #cbd5e1;
            border-radius: 16px;
            height: 240px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        /* Кот закреплен по центру */
        .cat-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: absolute;
            top: 50px;
            left: 100px;
            transition: transform 0.2s ease, filter 0.3s;
            pointer-events: none; /* Чтобы кот не мешал кликать по мячу */
        }
        
        /* Физический мяч */
        .toy-ball {
            position: absolute;
            width: 36px;
            height: 36px;
            font-size: 32px;
            line-height: 36px;
            text-align: center;
            cursor: pointer;
            will-change: transform;
        }
        
        .status-bar { margin: 12px 0; text-align: left; }
        .label { font-weight: bold; color: #4a5568; font-size: 13px; margin-bottom: 4px; }
        .progress-bg { background: #edf2f7; border-radius: 10px; height: 14px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; transition: width 0.3s ease, background-color 0.3s; }
        
        .btn-container { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
        button {
            background: #3182ce; color: white; border: none; padding: 12px 10px;
            border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 13px;
            flex: 1; transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #2b6cb0; }
        button:active { transform: scale(0.95); }
        
        .message { font-style: italic; color: #718096; min-height: 38px; margin-top: 15px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="game-room">
    <h1>Виртуальный Басик 🐾</h1>
    
    <div class="sofa-zone" id="room">
        <!-- Фото кота (имена твоих файлов сохранены) -->
        <img id="catImg" class="cat-photo" src="MVIMG_20261008_193929.jpg" alt="Мой Кот">
        <!-- Мяч с физикой -->
        <div id="ball" class="toy-ball">⚽</div>
    </div>
    
    <div id="message" class="message">Пни мячик, чтобы поиграть с Басиком! ⚽</div>

    <div class="status-bar">
        <div class="label">🍖 Сытость: <span id="satiety-txt">100</span>%</div>
        <div class="progress-bg"><div id="satiety-bar" class="progress-fill" style="background-color: #48bb78;"></div></div>
    </div>

    <div class="status-bar">
        <div class="label">🎉 Настроение: <span id="joy-txt">100</span>%</div>
        <div class="progress-bg"><div id="joy-bar" class="progress-fill" style="background-color: #4299e1;"></div></div>
    </div>

    <div class="btn-container">
        <button onclick="feed()">Покормить 🐟</button>
        <button onclick="pet()">Погладить кота 🛋️</button>
    </div>
</div>

<script>
    let satiety = 100;
    let joy = 100;

    const NORMAL_IMG = "MVIMG_20261008_193929.jpg";
    const HAPPY_IMG = "MVIMG_20261008_193930.jpg";

    const room = document.getElementById('room');
    const ball = document.getElementById('ball');
    const catImg = document.getElementById('catImg');
    const msgEl = document.getElementById('message');
    const satTxt = document.getElementById('satiety-txt');
    const satBar = document.getElementById('satiety-bar');
    const joyTxt = document.getElementById('joy-txt');
    const joyBar = document.getElementById('joy-bar');

    // Переменные физического движка
    let ballX = 20;        // Позиция X
    let ballY = 180;       // Позиция Y
    let vx = 0;            // Скорость по X
    let vy = 0;            // Скорость по Y
    const radius = 18;     // Радиус мяча (36px / 2)
    const friction = 0.98; // Трение (чтобы мяч плавно останавливался)
    const bounce = -0.75;  // Сила отскока от стен (минус меняет направление)

    // Размеры игровой зоны
    const roomWidth = 340; 
    const roomHeight = 240;

    // Позиция хитбокса кота для столкновений
    const cat = { x: 100 + 65, y: 50 + 65, r: 65 }; 

    // Главный цикл физики (работает на requestAnimationFrame для идеальной плавности)
    function updatePhysics() {
        // Применяем скорость к координатам
        ballX += vx;
        ballY += vy;

        // Гасим скорость трением
        vx *= friction;
        vy *= friction;

        // Если скорость совсем крошечная - обнуляем
        if (Math.abs(vx) < 0.05) vx = 0;
        if (Math.abs(vy) < 0.05) vy = 0;

        // Отскок от левой и правой стены
        if (ballX < 0) {
            ballX = 0;
            vx *= bounce;
        } else if (ballX > roomWidth - radius * 2) {
            ballX = roomWidth - radius * 2;
            vx *= bounce;
        }

        // Отскок от потолка и пола
        if (ballY < 0) {
            ballY = 0;
            vy *= bounce;
        } else if (ballY > roomHeight - radius * 2) {
            ballY = roomHeight - radius * 2;
            vy *= bounce;
        }

        // --- Физика столкновения мяча с Котом ---
        let ballCenterX = ballX + radius;
        let ballCenterY = ballY + radius;
        
        let dx = ballCenterX - cat.x;
        let dy = ballCenterY - cat.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        let minDistance = radius + cat.r;

        if (distance < minDistance) {
            // Кот отбивает мяч! Находим угол столкновения
            let angle = Math.atan2(dy, dx);
            
            // Выталкиваем мяч за пределы кота, чтобы он не застрял
            ballX = cat.x + Math.cos(angle) * minDistance - radius;
            ballY = cat.y + Math.sin(angle) * minDistance - radius;

            // Меняем вектор скорости (отскок от круга)
            let speed = Math.sqrt(vx * vx + vy * vy) + 2; // Немного ускоряем от удара
            if(speed < 3) speed = 5; // Если мяч еле катился, кот дает ему пинок
            
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed;

            // Кот радуется игре!
            triggerCatJoy('Басик поймал мяч лапами и отбил его обратно! ⚽🐾', 'translateY(-15px)');
            if (joy < 100) {
                joy = Math.min(100, joy + 15);
                updateUI();
            }
        }

        // Отрисовка позиции мяча на экране
        ball.style.transform = `translate(${ballX}px, ${ballY}px) rotate(${ballX * 2}deg)`;

        requestAnimationFrame(updatePhysics);
    }

    // Пинок мяча по клику / тапу
    ball.addEventListener('mousedown', kickBall);
    ball.addEventListener('touchstart', (e) => {
        e.preventDefault();
        kickBall(e);
    });

    function kickBall(e) {
        // Случайный сильный импульс вверх и вбок
        vx = (Math.random() - 0.5) * 20; 
        vy = -(Math.random() * 12 + 10); // Летит вверх

        msgEl.innerText = 'Ты круто запустил мяч! Ищи отскок! 🚀';
        
        if (joy < 100) {
            joy = Math.min(100, joy + 5);
            updateUI();
        }
    }

    function updateUI() {
        satTxt.innerText = satiety;
        satBar.style.width = satiety + '%';
        satBar.style.backgroundColor = satiety > 50 ? '#48bb78' : (satiety > 20 ? '#ed8936' : '#f56565');

        joyTxt.innerText = joy;
        joyBar.style.width = joy + '%';
        joyBar.style.backgroundColor = joy > 50 ? '#4299e1' : (joy > 20 ? '#ed8936' : '#f56565');

        if (satiety <= 0 && joy <= 0) {
            catImg.style.filter = 'grayscale(1) contrast(0.8)';
            msgEl.innerText = 'Басик заскучал без игр... Нажми на мяч!';
        } else {
            catImg.style.filter = 'none';
        }
    }

    function triggerCatJoy(messageText, transformAnimation) {
        catImg.src = HAPPY_IMG;
        msgEl.innerText = messageText;
        catImg.style.transform = transformAnimation;

        setTimeout(() => {
            catImg.src = NORMAL_IMG;
            catImg.style.transform = 'none';
        }, 1200);
    }

    function feed() {
        if (satiety < 100) {
            satiety = Math.min(100, satiety + 20);
            triggerCatJoy('Хрум! Басик с удовольствием лопает рыбку! 🐟', 'scale(1.1)');
            updateUI();
        }
    }

    function pet() {
        if (joy < 100) {
            joy = Math.min(100, joy + 15);
            triggerCatJoy('Муррр! Басик довольно жмурится! 👋', 'rotate(5deg)');
            updateUI();
        }
    }

    // Постепенное падение показателей
    setInterval(() => {
        satiety = Math.max(0, satiety - 3);
        joy = Math.max(0, joy - 3);
        updateUI();
    }, 4000);

    // Запуск физического движка
    updatePhysics();
    updateUI();
</script>

</body>
</html>
