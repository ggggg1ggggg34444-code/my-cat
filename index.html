<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Виртуальный Басик 🐾</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e0f7fa; text-align: center; margin: 0; padding: 10px; user-select: none; -webkit-user-select: none; touch-action: none; }
        .game-container { background: white; max-width: 450px; height: 90vh; margin: 5px auto; padding: 15px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; box-sizing: border-box; }
        h1 { margin: 5px 0; color: #006064; font-size: 22px; }
        
        /* Игровая зона */
        .game-field { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; margin: 10px 0; background: #f9f9f9; border-radius: 20px; border: 2px dashed #b2dfdb; overflow: hidden; }
        
        /* Кот */
        .cat-container { pointer-events: none; z-index: 1; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .cat-img { max-width: 70%; max-height: 220px; border-radius: 15px; transition: transform 0.2s; object-fit: contain; }
        .bounce { animation: bounceAnim 0.4s ease; }
        
        /* Мячик с поддержкой физики */
        .toy-ball { width: 55px; height: 55px; background: radial-gradient(circle at 18px 18px, #ff9800, #e65100); border-radius: 50%; position: absolute; cursor: grab; touch-action: none; box-shadow: 0 5px 10px rgba(0,0,0,0.3); z-index: 9999; left: 0; top: 0; }
        .toy-ball:active { cursor: grabbing; }

        .status-container { display: flex; justify-content: space-around; background: #f5f5f5; padding: 10px; border-radius: 15px; }
        .status { font-size: 15px; font-weight: bold; color: #37474f; }
        #message { color: #00796b; font-weight: bold; min-height: 20px; margin: 5px 0; font-size: 14px; }
        
        .buttons { display: flex; justify-content: center; gap: 10px; margin-top: 5px; }
        .btn { background: #00838f; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 15px; cursor: pointer; flex: 1; transition: 0.2s; font-weight: bold; }
        
        @keyframes bounceAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Любимый Басик 🐾</h1>
    
    <div class="status-container">
        <div class="status">🍖 Сытость: <span id="hunger">100</span>%</div>
        <div class="status">🎉 Радость: <span id="happiness">100</span>%</div>
    </div>
    
    <div id="message">Толкни мяч пальцем, пусть он полетает! 🏀</div>
    
    <div class="game-field" id="field">
        <div class="cat-container">
            <img id="cat" class="cat-img" src="MVIMG_20261008_193929.jpg" alt="Басик">
        </div>
        <div id="ball" class="toy-ball"></div>
    </div>

    <div class="buttons">
        <button class="btn" onclick="feedCat()">Покормить 🐟</button>
        <button class="btn" onclick="petCat()">Погладить 👋</button>
    </div>
</div>

<script>
    let hunger = 100;
    let happiness = 100;
    
    const cat = document.getElementById('cat');
    const ball = document.getElementById('ball');
    const field = document.getElementById('field');
    const msg = document.getElementById('message');

    // Настройки физики мяча
    let ballX = 170; // Начальная позиция X
    let ballY = 250; // Начальная позиция Y
    let vx = 0;      // Скорость по X
    let vy = 0;      // Скорость по Y
    const gravity = 0.3;     // Сила притяжения вниз
    const bounce = -0.7;      // Сила отскока от стен (минус меняет направление)
    const friction = 0.98;    // Трение воздуха (замедление)
    const ballSize = 55;

    let isDragging = false;
    let lastTouchX = 0;
    let lastTouchY = 0;
    let touchId = null;

    // Установка мяча в стартовую позицию при запуске
    setTimeout(() => {
        const fieldRect = field.getBoundingClientRect();
        ballX = (fieldRect.width / 2) - (ballSize / 2);
        ballY = fieldRect.height - ballSize - 20;
        updateBallPosition();
    }, 100);

    function updateBallPosition() {
        ball.style.transform = `translate(${ballX}px, ${ballY}px)`;
    }

    // Движение мяча по законам физики
    function animate() {
        if (!isDragging) {
            vy += gravity;    // Гравитация тянет вниз
            vx *= friction;   // Трение замедляет движение
            vy *= friction;
            
            ballX += vx;
            ballY += vy;

            const fieldRect = field.getBoundingClientRect();

            // Отскок от правого и левого края
            if (ballX + ballSize > fieldRect.width) {
                ballX = fieldRect.width - ballSize;
                vx *= bounce;
            } else if (ballX < 0) {
                ballX = 0;
                vx *= bounce;
            }

            // Отскок от пола и потолка
            if (ballY + ballSize > fieldRect.height) {
                ballY = fieldRect.height - ballSize;
                vy *= bounce;
                // Дополнительное трение при качении по полу
                vx *= 0.95; 
            } else if (ballY < 0) {
                ballY = 0;
                vy *= bounce;
            }

            updateBallPosition();

            // Проверка, поймал ли Басик летящий мяч
            if ((Math.abs(vx) > 0.5 || Math.abs(vy) > 0.5) && checkCollision()) {
                happiness = Math.min(100, happiness + 5);
                triggerAnimation("Басик поймал летящий мяч! 🏀👏");
                // Мяч немного отскакивает от кота при ударе
                vx *= -0.5;
                vy *= -0.5;
            }
        }
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Тач-события для телефона
    ball.addEventListener('touchstart', (e) => {
        if (hunger <= 0 || happiness <= 0) return;
        isDragging = true;
        vx = 0;
        vy = 0;
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        
        const fieldRect = field.getBoundingClientRect();
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
        
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        
        let touch = null;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) {
                touch = e.touches[i];
                break;
            }
        }
        if (!touch) return;
        e.preventDefault();

        const fieldRect = field.getBoundingClientRect();
        
        // Перемещаем мяч за пальцем
        ballX = touch.clientX - fieldRect.left - (ballSize / 2);
        ballY = touch.clientY - fieldRect.top - (ballSize / 2);

        // Ограничиваем внутри поля при перетаскивании
        ballX = Math.max(0, Math.min(ballX, fieldRect.width - ballSize));
        ballY = Math.max(0, Math.min(ballY, fieldRect.height - ballSize));

        // Вычисляем скорость броска на основе движения пальца
        vx = touch.clientX - lastTouchX;
        vy = touch.clientY - lastTouchY;

        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;

        updateBallPosition();
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        touchId = null;
        
        // Ограничиваем максимальную скорость, чтобы мяч не улетал в космос
        vx = Math.max(-15, Math.min(vx, 15));
        vy = Math.max(-15, Math.min(vy, 15));
    });

    // Обычные функции тамагочи
    function updateStatus() {
        document.getElementById('hunger').innerText = hunger;
        document.getElementById('happiness').innerText = happiness;
        if (hunger <= 0 || happiness <= 0) {
            msg.innerText = "Басик уснул от усталости... 💤";
        }
    }

    function triggerAnimation(text) {
        if (hunger <= 0 || happiness <= 0) return;
        msg.innerText = text;
        cat.classList.add('bounce');
        cat.src = "MVIMG_20261008_193930.jpg"; 
        
        setTimeout(() => {
            cat.classList.remove('bounce');
            cat.src = "MVIMG_20261008_193929.jpg"; 
            updateStatus();
        }, 1200);
    }

    function feedCat() {
        if (hunger <= 0 || happiness <= 0) return;
        hunger = Math.min(100, hunger + 25);
        triggerAnimation("Муррр! Очень вкусная рыбка! 🐟");
    }

    function petCat() {
        if (hunger <= 0 || happiness <= 0) return;
        happiness = Math.min(100, happiness + 20);
        triggerAnimation("Мур-мур... Басику приятно! 🥰");
    }

    function checkCollision() {
        const ballRect = ball.getBoundingClientRect();
        const catRect = cat.getBoundingClientRect();
        
        return !(ballRect.right < catRect.left || 
                 ballRect.left > catRect.right || 
                 ballRect.bottom < catRect.top || 
                 ballRect.top > catRect.bottom);
    }

    setInterval(() => {
        if (hunger > 0 && happiness > 0) {
            hunger = Math.max(0, hunger - 3);
            happiness = Math.max(0, happiness - 4);
            updateStatus();
        }
    }, 5000);
</script>

</body>
</html>
